[workspace]
resolver = "2"
members = [
    "crates/strata_editor",
]

[workspace.package]
version = "0.1.3"
authors = ["Strata Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/strataui/editor"
homepage = "https://github.com/strataui/editor"
documentation = "https://docs.rs/strata-editor"
keywords = ["editor", "code-editor", "rich-text", "tree-sitter", "strata"]
categories = ["gui", "text-editors"]

[workspace.dependencies]
strata-primitives = "0.1.1"
strata-dom = "0.1.4"
strata-layout = "0.1.2"
strata-macro = "0.1.4"
strata-render = "0.1.4"
strata-ui = "0.1.7"
strata-ui-platform = "0.1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
