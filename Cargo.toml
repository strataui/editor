[workspace]
resolver = "2"
members = [
    "crates/strata_editor",
]

[workspace.package]
version = "0.1.0"
authors = ["Strata Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/strataui/editor"
homepage = "https://github.com/strataui/editor"
documentation = "https://docs.rs/strata-editor"
keywords = ["editor", "code-editor", "rich-text", "tree-sitter", "strata"]
categories = ["gui", "text-editors"]

[workspace.dependencies]
strata-editor = { path = "crates/strata_editor", version = "0.1.1" }
strata-primitives = "0.1.0"
strata-dom = "0.1.3"
strata-layout = "0.1.1"
strata-macro = "0.1.3"
strata-render = "0.1.3"
strata-ui = "0.1.5"

[profile.dev]
opt-level = 1
