[package]
name = "strata-editor"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Monaco-class interactive code editor and rich-text document engine for Strata UI"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["builtin-syntax"]
builtin-syntax = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
]

[dependencies]
strata-dom = { workspace = true }
strata-layout = { workspace = true }
strata-macro = { workspace = true }
strata-primitives = { workspace = true }
strata-render = { workspace = true }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = { version = "0.27.2", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }

[dev-dependencies]
strata-ui = { workspace = true }
